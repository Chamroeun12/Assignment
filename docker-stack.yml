version: '3.8'

# Docker Swarm production stack definition
# Deploy via: docker stack deploy --with-registry-auth -c docker-stack.yml cicd-homework2
services:
  web:
    image: ${ECR_REGISTRY:-399311815210.dkr.ecr.ap-southeast-2.amazonaws.com}/${ECR_REPO:-cicd-homework2}:${IMAGE_TAG:-latest}
    environment:
      - APP_VERSION=${IMAGE_TAG:-1.0.0}
      - PORT=5000
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
        max_failure_ratio: 0.2
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - swarm-network

  nginx:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_conf_v1
        target: /etc/nginx/nginx.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
    depends_on:
      - web
    networks:
      - swarm-network

configs:
  nginx_conf_v1:
    file: ./nginx/nginx.conf

networks:
  swarm-network:
    driver: overlay
    attachable: true
