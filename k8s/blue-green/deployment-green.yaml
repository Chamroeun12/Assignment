apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-homework2-green
  namespace: cicd-production
  labels:
    app: cicd-homework2
    version: green
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-homework2
      version: green
  template:
    metadata:
      labels:
        app: cicd-homework2
        version: green
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: web-app
          image: 399311815210.dkr.ecr.ap-southeast-2.amazonaws.com/cicd-homework2:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_VERSION
              value: "2.0.0-green"
            - name: ENVIRONMENT
              value: "production-green"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
