apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cicd-assignment-monitor
  namespace: cicd-production
  labels:
    app: cicd-assignment
    release: prometheus
spec:
  selector:
    matchLabels:
      app: cicd-assignment
  endpoints:
    - port: http
      path: /health
      interval: 15s
      scrapeTimeout: 5s
