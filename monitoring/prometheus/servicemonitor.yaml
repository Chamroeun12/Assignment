apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cicd-homework2-monitor
  namespace: cicd-production
  labels:
    app: cicd-homework2
    release: prometheus
spec:
  selector:
    matchLabels:
      app: cicd-homework2
  endpoints:
    - port: http
      path: /health
      interval: 15s
      scrapeTimeout: 5s
