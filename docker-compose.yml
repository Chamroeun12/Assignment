version: '3.8'

# Multi-service local development stack for CI/CD Assignment
# Usage: docker compose up --build -d
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cicd-assignment-web:local
    container_name: cicd-assignment-web
    restart: unless-stopped
    environment:
      - APP_VERSION=1.0.0-dev
      - PORT=5000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: cicd-assignment-nginx:local
    container_name: cicd-assignment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge
