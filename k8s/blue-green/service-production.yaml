apiVersion: v1
kind: Service
metadata:
  name: cicd-homework2-prod
  namespace: cicd-production
  labels:
    app: cicd-homework2
    role: production
spec:
  type: LoadBalancer
  selector:
    app: cicd-homework2
    version: blue  # Initially routes 100% of live production traffic to Blue
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
