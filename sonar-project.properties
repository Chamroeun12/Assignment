# SonarQube Scanner Configuration
sonar.projectKey=cicd-assignment
sonar.projectName=cicd-assignment
sonar.projectVersion=2.0.0

# Source and Test paths
sonar.sources=app.py,templates
sonar.tests=tests
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml

# Encodings
sonar.sourceEncoding=UTF-8

# File exclusions (exclude docs, binary files, generated reports)
sonar.exclusions=docs/**,screenshots/**,*.pdf,*.docx,build_submission_report.py,generate_evidence_screens.py,docker-stack.yml
sonar.test.inclusions=tests/**
