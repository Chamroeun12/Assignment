apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-assignment-blue
  namespace: cicd-production
  labels:
    app: cicd-assignment
    version: blue
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-assignment
      version: blue
  template:
    metadata:
      labels:
        app: cicd-assignment
        version: blue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: web-app
          image: 399311815210.dkr.ecr.ap-southeast-2.amazonaws.com/cicd-assignment:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.0.0-blue"
            - name: ENVIRONMENT
              value: "production-blue"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
