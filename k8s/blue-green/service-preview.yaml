apiVersion: v1
kind: Service
metadata:
  name: cicd-assignment-preview
  namespace: cicd-production
  labels:
    app: cicd-assignment
    role: preview
spec:
  type: ClusterIP
  selector:
    app: cicd-assignment
    version: green  # Routes internal preview and integration test traffic to candidate Green
  ports:
    - name: http
      port: 8080
      targetPort: 5000
      protocol: TCP
